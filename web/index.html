<!doctype html>
<meta charset="utf-8">
<title>One Fire Record</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 6px 0; color: #555; }
  button { font: inherit; padding: 6px 14px; border: 1px solid #999; background: #fff; cursor: pointer; }
  button.on { background: #222; color: #fff; border-color: #222; }
  svg { width: 100%; height: auto; margin-top: 12px; }
  text { font-size: 11px; fill: #555; }
  .key span { display: inline-block; margin-right: 14px; }
  .key i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; }
</style>
<h1>One Fire Record — Portugal, 2001–2025</h1>
<p>Active-fire detections per year, NASA FIRMS (MODIS Terra/Aqua and VIIRS Suomi NPP).</p>
<button id="raw" class="on">Raw</button><button id="harm">Harmonized</button>
<svg id="chart" viewBox="0 0 800 380"></svg>
<p class="key" id="key"></p>
<p id="note"></p>
<script src="data.js"></script>
<script>
const W = 800, H = 380, L = 55, R = 15, T = 15, B = 30, D = DATA, n = D.years.length;
const max = Math.max(...D.hi, ...D.viirs.filter(v => v != null)) * 1.05;
const x = i => L + i * (W - L - R) / (n - 1), y = v => H - B - v * (H - T - B) / max;
const i2012 = D.years.indexOf(2012), i2020 = D.years.indexOf(2020);
const path = (vals, from, to) => vals.slice(from, to).map((v, k) => (k ? "L" : "M") + x(from + k) + " " + y(v)).join("");
const line = (vals, from, to, color, dash) => `<path d="${path(vals, from, to)}" fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ""}/>`;
const band = (from, to) => `<path d="${path(D.hi, from, to)}${D.lo.slice(from, to).map((v, k) => "L" + x(from + k) + " " + y(v)).reverse().join("")}Z" fill="#e4572e" opacity=".18"/>`;
const key = items => items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join("");

function draw(mode) {
  let s = "";
  for (let v = 0; v <= max; v += 5000) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v / 1000}k</text>`;
  D.years.forEach((yr, i) => { if (yr % 3 == 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${yr}</text>`; });
  s += `<line x1="${x(i2012)}" x2="${x(i2012)}" y1="${T}" y2="${H - B}" stroke="#bbb" stroke-dasharray="2 3"/><text x="${x(i2012) + 4}" y="${T + 10}">VIIRS starts</text>`;
  if (mode == "raw") {
    s += line(D.modis, 0, i2012, "#3b6fb6") + line(D.viirs, i2012, n, "#222");
    s += `<path d="M${x(i2012 - 1)} ${y(D.modis[i2012 - 1])}L${x(i2012)} ${y(D.viirs[i2012])}" stroke="#999" stroke-dasharray="2 3"/>`;
    key_.innerHTML = key([["#3b6fb6", "MODIS (2001–2011)"], ["#222", "VIIRS (2012–2025)"]]);
    const a = D.modis.slice(0, i2012).reduce((p, c) => p + c) / i2012, b = D.viirs.slice(i2012).reduce((p, c) => p + c) / (n - i2012);
    note.textContent = `Naively stitched record. Mean detections per year go from ${Math.round(a).toLocaleString()} (MODIS era) to ${Math.round(b).toLocaleString()} (VIIRS era): ×${(b / a).toFixed(1)}, mostly because VIIRS has finer pixels, not because fire changed.`;
  } else {
    s += band(0, i2012 + 1) + band(i2020, n);
    s += line(D.pred.slice(0, i2012).concat(D.viirs[i2012]), 0, i2012 + 1, "#e4572e") + line(D.viirs, i2012, n, "#222") + line(D.pred, i2020, n, "#e4572e", true);
    key_.innerHTML = key([["#e4572e", "Back-cast VIIRS-equivalent, 90% interval"], ["#222", "VIIRS observed"], ["#e4572e", "Hold-out prediction 2020–2025 (dashed)"]]);
    const c = D.score;
    note.textContent = `Hold-out 2020–2025 (model never saw these years): mean annual error ${c.mape_model.toFixed(1)}% vs ${c.mape_ratio.toFixed(1)}% for a single constant factor; 90% interval contains the observed total in ${c.coverage} of ${c.n_hold} years; weekly correlation r = ${c.weekly_r.toFixed(3)}.`;
  }
  chart.innerHTML = s;
  raw.className = mode == "raw" ? "on" : ""; harm.className = mode == "harm" ? "on" : "";
}
const key_ = document.getElementById("key");
raw.onclick = () => draw("raw"); harm.onclick = () => draw("harm");
draw("raw");
</script>
